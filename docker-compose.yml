# =============================================================================
# Hospital Survey System - Docker Compose Configuration
# =============================================================================
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f        # View logs
#   docker compose down           # Stop all services
#   docker compose restart app    # Restart app only
#
# First time setup:
#   1. Edit the environment variables below
#   2. Run: docker compose up -d
#   3. Run: docker compose exec app npx prisma db push
#   4. Run: docker compose exec app npx prisma db seed
# =============================================================================

version: "3.8"

services:
  # ---- MySQL Database ----
  mysql:
    image: mysql:8.0
    container_name: hospital-survey-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE: ${DB_NAME:-hospital_survey}
      MYSQL_USER: ${DB_USER:-survey_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-surveypassword123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hospital-network

  # ---- Next.js Application ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital-survey-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://${DB_USER:-survey_app}:${DB_PASSWORD:-surveypassword123}@mysql:3306/${DB_NAME:-hospital_survey}
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-very-long-random-string-at-least-64-chars}
      - JWT_EXPIRES_IN=7d
      - NEXT_PUBLIC_APP_URL=${APP_URL:-http://localhost:3000}
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads
    networks:
      - hospital-network

  # ---- Nginx Reverse Proxy (Optional - for production) ----
  nginx:
    image: nginx:alpine
    container_name: hospital-survey-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./deploy/ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - hospital-network

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local

networks:
  hospital-network:
    driver: bridge
